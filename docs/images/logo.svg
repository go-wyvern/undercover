      />
      <g class="robot-eyes">
        <rect x="66" y="67" width="10" height="17" rx="5" fill="#b7ed99" />
        <rect x="104" y="67" width="10" height="17" rx="5" fill="#b7ed99" />
      </g>
      <path
        d="M84 87C88 90 92 90 96 87"
