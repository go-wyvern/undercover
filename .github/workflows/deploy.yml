name: Publish undercover image

# Like spxbench, publishing is manually triggered from the main branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-undercover
  cancel-in-progress: false

jobs:
  validate:
    name: Integration tests (temporary databases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # CI-only databases for integration tests; discarded with this job.
    # These services are neither included in the image nor deployed to Kubernetes.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: undercover
          POSTGRES_PASSWORD: undercover
          POSTGRES_DB: undercover
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U undercover -d undercover"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
          npm --prefix web test

      # Temporary, isolated Cluster used only to verify routing and ACL authentication.
      - name: Start test Redis Cluster
        run: |
          set -euo pipefail
          for port in 7000 7001 7002; do
            docker run -d --name "redis-cluster-$port" --network host redis:7-alpine \
              redis-server --bind 127.0.0.1 --port "$port" \
              --cluster-enabled yes --cluster-announce-ip 127.0.0.1 \
              --cluster-config-file /data/nodes.conf \
              --appendonly no --save ""
          done
          for port in 7000 7001 7002; do
            for attempt in $(seq 1 30); do
              if docker exec "redis-cluster-$port" redis-cli -p "$port" ping; then break; fi
              sleep 1
            done
            docker exec "redis-cluster-$port" redis-cli -p "$port" ping
          done
          docker exec redis-cluster-7000 redis-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
            --cluster-replicas 0 --cluster-yes
          for port in 7000 7001 7002; do
            docker exec "redis-cluster-$port" redis-cli -p "$port" ACL SETUSER \
              undercover on '>cluster-test-password' '~undercover:test:*' \
              +ping +hello +get +set +del +ttl '+cluster|slots' '+client|setinfo'
            for attempt in $(seq 1 30); do
              if docker exec "redis-cluster-$port" redis-cli -p "$port" cluster info | grep -q 'cluster_state:ok'; then break; fi
              sleep 1
            done
            docker exec "redis-cluster-$port" redis-cli -p "$port" cluster info | grep -q 'cluster_state:ok'
          done

      - name: Test Go with PostgreSQL and Redis
        env:
          UNDERCOVER_TEST_DATABASE_URL: postgresql://undercover:undercover@127.0.0.1:5432/undercover?sslmode=disable
          UNDERCOVER_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          UNDERCOVER_TEST_REDIS_ADDR: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
          UNDERCOVER_TEST_REDIS_USERNAME: undercover
          UNDERCOVER_TEST_REDIS_PASSWORD: cluster-test-password
        run: |
          go vet ./...
          go test -race ./...

  build-and-push:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve image name and revision
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.title=undercover
            org.opencontainers.image.description=Linx AI hosted multiplayer undercover game
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=undercover
          cache-to: type=gha,mode=max,scope=undercover

      - name: Record published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Published: $IMAGE_NAME:main"
            echo "Revision: $IMAGE_NAME:$IMAGE_REVISION"
            echo "Digest: $IMAGE_NAME@$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
